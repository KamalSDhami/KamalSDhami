name: Update README

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the "Recently pushed to" block
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Three most recently pushed repos, skipping forks and this profile repo.
          LIST=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/users/KamalSDhami/repos?sort=pushed&direction=desc&per_page=20" \
            | jq -r '[.[] | select(.fork | not) | select(.name != "KamalSDhami")][:3]
                     | .[] | "- [\(.name)](\(.html_url))" + (if .description != null and .description != "" then " · \(.description)" else "" end)')

          if [ -z "$LIST" ]; then
            echo "Empty repo list from the API, leaving README untouched."
            exit 1
          fi

          printf '%s\n' "$LIST" > /tmp/recent.md
          echo "New block:"; cat /tmp/recent.md

          # Replace everything between the markers with the new list.
          awk -v blockfile=/tmp/recent.md '
            /<!-- RECENT:START -->/ { print; while ((getline line < blockfile) > 0) print line; skip=1; next }
            /<!-- RECENT:END -->/   { skip=0 }
            !skip
          ' README.md > /tmp/README.new
          mv /tmp/README.new README.md

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh recently pushed repos"
            git push
          fi

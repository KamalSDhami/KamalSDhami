name: Update README

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - assets/live.py
      - .github/workflows/update-readme.yml

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The built-in token cannot see private repos, so running without
      # PROFILE_TOKEN would drop them from the dashboard. Skip instead.
      - name: Check for PROFILE_TOKEN
        id: token
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          if [ -z "$PROFILE_TOKEN" ]; then
            echo "::notice::PROFILE_TOKEN secret is not set, skipping. See assets/live.py for how to create it."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild activity dashboard and README blocks
        if: steps.token.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          PROFILE_TOKEN_SET: "true"
        run: python3 assets/live.py

      - name: Commit if anything changed
        if: steps.token.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/activity.svg
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh activity dashboard"
            git push
          fi

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">Kamal Singh Dhami</title>
<desc id="d">Full-stack engineer and ML student in Dehradun, India. Animated foothills with a route tracing the ridge line.</desc>
<defs>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#16202b" stroke-width=".7"/></pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0e1a2b"/><stop offset="1" stop-color="#0b0f14"/></linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0b0f14"/><stop offset=".5" stop-color="#0b0f14" stop-opacity="0"/></linearGradient>
  <radialGradient id="sun"><stop stop-color="#4a9eff" stop-opacity=".55"/><stop offset="1" stop-color="#4a9eff" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="1200" height="300" rx="16"/></clipPath>
</defs>
<style>
  .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .route{stroke-dasharray:6 14;animation:flow 4s linear infinite}
  .draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 7s ease-out infinite}
  .sun{animation:breathe 6s ease-in-out infinite;transform-origin:1010px 95px}
  .star{animation:twinkle 3s ease-in-out infinite}
  .s2{animation-delay:1s} .s3{animation-delay:2s} .s4{animation-delay:.5s}
  .cursor{animation:blink 1.1s steps(1) infinite}
  @keyframes flow{to{stroke-dashoffset:-80}}
  @keyframes draw{0%{stroke-dashoffset:900;opacity:0}10%{opacity:1}70%,100%{stroke-dashoffset:0;opacity:1}}
  @keyframes breathe{50%{transform:scale(1.18);opacity:.8}}
  @keyframes twinkle{50%{opacity:.15}}
  @keyframes blink{50%{opacity:0}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="300" fill="url(#sky)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <!-- stars -->
  <circle class="star" cx="700" cy="60" r="1.5" fill="#e6edf3"/>
  <circle class="star s2" cx="860" cy="40" r="1.2" fill="#e6edf3"/>
  <circle class="star s3" cx="1120" cy="70" r="1.6" fill="#e6edf3"/>
  <circle class="star s4" cx="960" cy="90" r="1.1" fill="#e6edf3"/>
  <circle class="star s2" cx="1160" cy="30" r="1.3" fill="#e6edf3"/>
  <!-- sun -->
  <circle class="sun" cx="1010" cy="95" r="70" fill="url(#sun)"/>
  <circle cx="1010" cy="95" r="9" fill="#4a9eff"/>
  <!-- hills -->
  <path d="M680,230 L700,150 L760,185 L830,120 L900,170 L960,135 L1040,190 L1100,150 L1200,200 L1200,300 L620,300 Z" fill="#152333"/>
  <path d="M620,300 L690,210 L720,250 L790,190 L860,240 L930,205 L1010,255 L1080,215 L1200,260 L1200,300 Z" fill="#101b28"/>
  <path d="M580,300 L640,262 L680,290 L760,250 L850,285 L930,262 L1020,290 L1110,268 L1200,290 L1200,300 Z" fill="#0c141d"/>
  <!-- route over the ridge -->
  <path class="draw" d="M600,205 C680,150 720,220 800,165 S900,200 960,150 S1080,200 1180,170" fill="none" stroke="#4a9eff" stroke-width="2" stroke-linecap="round" opacity=".9"/>
  <path class="route" d="M600,205 C680,150 720,220 800,165 S900,200 960,150 S1080,200 1180,170" fill="none" stroke="#e6edf3" stroke-width="1" stroke-linecap="round" opacity=".35"/>
  <circle cx="800" cy="165" r="3.5" fill="#7ee787"/>
  <circle cx="960" cy="150" r="3.5" fill="#7ee787"/>
  <circle cx="1180" cy="170" r="3.5" fill="#f0883e"/>
  <!-- left fade so text sits clean -->
  <rect width="1200" height="300" fill="url(#fade)"/>
  <!-- text -->
  <text class="mono" x="56" y="78" font-size="13" fill="#4a9eff">~/dehradun $ whoami<tspan class="cursor" fill="#e6edf3">_</tspan></text>
  <text class="sans" x="56" y="138" font-size="50" font-weight="700" fill="#e6edf3" letter-spacing="-1">Kamal Singh Dhami</text>
  <text class="sans" x="56" y="176" font-size="20" fill="#8b949e">Full-stack engineer and ML student. I build web products end to end,</text>
  <text class="sans" x="56" y="202" font-size="20" fill="#8b949e">train the occasional CNN, and write about what broke along the way.</text>
  <g class="mono" font-size="12.5">
    <rect x="56" y="232" width="150" height="26" rx="13" fill="#10161d" stroke="#1f2a36"/>
    <text x="131" y="249" text-anchor="middle" fill="#e6edf3">Dehradun, India</text>
    <rect x="216" y="232" width="118" height="26" rx="13" fill="#10161d" stroke="#1f2a36"/>
    <text x="275" y="249" text-anchor="middle" fill="#e6edf3">GEHU  '27</text>
    <rect x="344" y="232" width="162" height="26" rx="13" fill="#10161d" stroke="#1f2a36"/>
    <circle cx="361" cy="245" r="4" fill="#7ee787"/>
    <text x="431" y="249" text-anchor="middle" fill="#e6edf3">open to roles</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="16" fill="none" stroke="#1f2a36"/>
</g>
</svg>
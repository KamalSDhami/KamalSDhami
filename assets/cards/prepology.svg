<svg xmlns="http://www.w3.org/2000/svg" width="480" height="324" viewBox="0 0 480 324" role="img" aria-labelledby="t d">
<title id="t">Prepology</title>
<desc id="d">Tells a NEET, JEE or GATE student what to study today, and re-plans when they fall behind.</desc>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#16202b" stroke-width=".6"/></pattern>
  <radialGradient id="halo"><stop stop-color="#4a9eff" stop-opacity=".22"/><stop offset="1" stop-color="#4a9eff" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="480" height="324" rx="16"/></clipPath>
</defs>
<style>
  .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  
  .today{animation:step 6s steps(1) infinite}
  .ring{stroke-dasharray:138;stroke-dashoffset:138;animation:fill 6s ease-out infinite;transform:rotate(-90deg);transform-origin:140px 46px}
  .tick{animation:tick 6s steps(1) infinite;opacity:0}
  .t2{animation-delay:2s} .t3{animation-delay:4s}
  @keyframes step{0%{transform:translateY(0)}33%{transform:translateY(34px)}66%{transform:translateY(68px)}}
  @keyframes fill{0%{stroke-dashoffset:138}90%,100%{stroke-dashoffset:20}}
  @keyframes tick{0%{opacity:0}30%{opacity:1}100%{opacity:1}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#clip)">
  <rect width="480" height="324" fill="#0b0f14"/>
  <rect width="480" height="324" fill="url(#grid)"/>
  <circle cx="377" cy="181" r="110" fill="url(#halo)"/>
  <text class="mono" x="26" y="46" font-size="15" fill="#4a9eff">study planner · live</text>
  <text class="sans" x="26" y="88" font-size="32" font-weight="700" fill="#e6edf3" letter-spacing="-.4">Prepology</text>
  <text class="sans" x="26" y="136" font-size="20" fill="#8b949e">Tells a NEET, JEE or GATE</text><text class="sans" x="26" y="164" font-size="20" fill="#8b949e">student what to study</text><text class="sans" x="26" y="192" font-size="20" fill="#8b949e">today, and re-plans when</text><text class="sans" x="26" y="220" font-size="20" fill="#8b949e">they fall behind.</text>
  <g class="mono" font-size="15"><rect x="26" y="273" width="81" height="30" rx="15" fill="#10161d" stroke="#1f2a36"/>
<text x="66" y="294" text-anchor="middle" fill="#8b949e">Flutter</text>
<rect x="115" y="273" width="54" height="30" rx="15" fill="#10161d" stroke="#1f2a36"/>
<text x="142" y="294" text-anchor="middle" fill="#8b949e">Hono</text>
<rect x="177" y="273" width="90" height="30" rx="15" fill="#10161d" stroke="#1f2a36"/>
<text x="222" y="294" text-anchor="middle" fill="#8b949e">Supabase</text>
<rect x="275" y="273" width="54" height="30" rx="15" fill="#10161d" stroke="#1f2a36"/>
<text x="302" y="294" text-anchor="middle" fill="#8b949e">Groq</text></g>
  <g transform="translate(300,104) scale(0.86)">
  <rect class="today" x="14" y="66" width="108" height="32" rx="8" fill="none" stroke="#4a9eff" stroke-width="1.5"/>
  <rect x="18" y="70" width="100" height="24" rx="6" fill="#10161d" stroke="#1f2a36"/><text class="mono" x="26" y="86" font-size="9.5" fill="#8b949e">Organic chem</text><path class="tick t1" d="M106,82 l3,3 l6,-7" fill="none" stroke="#7ee787" stroke-width="1.6"/><rect x="18" y="104" width="100" height="24" rx="6" fill="#10161d" stroke="#1f2a36"/><text class="mono" x="26" y="120" font-size="9.5" fill="#8b949e">Mock test 4</text><path class="tick t2" d="M106,116 l3,3 l6,-7" fill="none" stroke="#7ee787" stroke-width="1.6"/><rect x="18" y="138" width="100" height="24" rx="6" fill="#10161d" stroke="#1f2a36"/><text class="mono" x="26" y="154" font-size="9.5" fill="#8b949e">Review 12 cards</text><path class="tick t3" d="M106,150 l3,3 l6,-7" fill="none" stroke="#7ee787" stroke-width="1.6"/>
  <circle cx="140" cy="46" r="22" fill="none" stroke="#1f2a36" stroke-width="5"/>
  <circle class="ring" cx="140" cy="46" r="22" fill="none" stroke="#4a9eff" stroke-width="5" stroke-linecap="round"/>
  <text class="mono" x="140" y="50" font-size="10" text-anchor="middle" fill="#e6edf3">today</text></g>
  <rect x=".5" y=".5" width="479" height="323" rx="16" fill="none" stroke="#1f2a36"/>
</g>
</svg>
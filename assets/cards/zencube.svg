<svg xmlns="http://www.w3.org/2000/svg" width="480" height="324" viewBox="0 0 480 324" role="img" aria-labelledby="t d">
<title id="t">ZenCube</title>
<desc id="d">A small container runtime, written to learn isolation and resource limits one syscall at a time.</desc>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#16202b" stroke-width=".6"/></pattern>
  <radialGradient id="halo"><stop stop-color="#7ee787" stop-opacity=".22"/><stop offset="1" stop-color="#7ee787" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="480" height="324" rx="16"/></clipPath>
</defs>
<style>
  .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  
  .wall{stroke-dasharray:6 6;animation:march 3s linear infinite}
  .proc{animation:bounce 4s ease-in-out infinite}
  .cube{animation:hover 5s ease-in-out infinite}
  @keyframes march{to{stroke-dashoffset:-24}}
  @keyframes bounce{0%,100%{transform:translate(0,0)}25%{transform:translate(22px,-14px)}50%{transform:translate(-18px,-6px)}75%{transform:translate(10px,16px)}}
  @keyframes hover{50%{transform:translateY(-4px)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#clip)">
  <rect width="480" height="324" fill="#0b0f14"/>
  <rect width="480" height="324" fill="url(#grid)"/>
  <circle cx="377" cy="181" r="110" fill="url(#halo)"/>
  <text class="mono" x="26" y="46" font-size="15" fill="#7ee787">linux sandbox</text>
  <text class="sans" x="26" y="88" font-size="32" font-weight="700" fill="#e6edf3" letter-spacing="-.4">ZenCube</text>
  <text class="sans" x="26" y="136" font-size="20" fill="#8b949e">A small container runtime,</text><text class="sans" x="26" y="164" font-size="20" fill="#8b949e">written to learn isolation</text><text class="sans" x="26" y="192" font-size="20" fill="#8b949e">and resource limits one</text><text class="sans" x="26" y="220" font-size="20" fill="#8b949e">syscall at a time.</text>
  <g class="mono" font-size="15"><rect x="26" y="273" width="27" height="30" rx="15" fill="#10161d" stroke="#1f2a36"/>
<text x="40" y="294" text-anchor="middle" fill="#8b949e">C</text>
<rect x="61" y="273" width="72" height="30" rx="15" fill="#10161d" stroke="#1f2a36"/>
<text x="97" y="294" text-anchor="middle" fill="#8b949e">Python</text>
<rect x="141" y="273" width="63" height="30" rx="15" fill="#10161d" stroke="#1f2a36"/>
<text x="172" y="294" text-anchor="middle" fill="#8b949e">Linux</text></g>
  <g transform="translate(300,104) scale(0.86)">
  <rect class="wall" x="24" y="24" width="132" height="132" rx="10" fill="none" stroke="#7ee787" stroke-width="1.5" opacity=".8"/>
  <g class="cube">
    <path d="M90,52 L128,72 L90,92 L52,72 Z" fill="#17311f" stroke="#7ee787" stroke-width="1.2"/>
    <path d="M52,72 L90,92 L90,132 L52,112 Z" fill="#102417" stroke="#7ee787" stroke-width="1.2"/>
    <path d="M128,72 L90,92 L90,132 L128,112 Z" fill="#0c1b12" stroke="#7ee787" stroke-width="1.2"/>
  </g>
  <circle class="proc" cx="90" cy="92" r="5" fill="#f0883e"/>
  <text class="mono" x="90" y="170" font-size="9.5" text-anchor="middle" fill="#8b949e">clone · cgroups · rlimit</text></g>
  <rect x=".5" y=".5" width="479" height="323" rx="16" fill="none" stroke="#1f2a36"/>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="324" viewBox="0 0 480 324" role="img" aria-labelledby="t d">
<title id="t">Link-UP</title>
<desc id="d">Find and form project teams at GEHU. Enforces the one-per-section rule.</desc>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#16202b" stroke-width=".6"/></pattern>
  <radialGradient id="halo"><stop stop-color="#bc8cff" stop-opacity=".22"/><stop offset="1" stop-color="#bc8cff" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="480" height="324" rx="16"/></clipPath>
</defs>
<style>
  .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  
  .link{stroke-dasharray:120;stroke-dashoffset:120;animation:draw 5s ease-in-out infinite}
  .l2{animation-delay:.6s} .l3{animation-delay:1.2s} .l4{animation-delay:1.8s}
  .hub{animation:pulse 2.4s ease-in-out infinite;transform-origin:90px 90px}
  @keyframes draw{0%{stroke-dashoffset:120}50%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-120}}
  @keyframes pulse{50%{transform:scale(1.25);opacity:.4}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#clip)">
  <rect width="480" height="324" fill="#0b0f14"/>
  <rect width="480" height="324" fill="url(#grid)"/>
  <circle cx="377" cy="181" r="110" fill="url(#halo)"/>
  <text class="mono" x="26" y="46" font-size="15" fill="#bc8cff">teammate finder · live</text>
  <text class="sans" x="26" y="88" font-size="32" font-weight="700" fill="#e6edf3" letter-spacing="-.4">Link-UP</text>
  <text class="sans" x="26" y="136" font-size="20" fill="#8b949e">Find and form project</text><text class="sans" x="26" y="164" font-size="20" fill="#8b949e">teams at GEHU. Enforces</text><text class="sans" x="26" y="192" font-size="20" fill="#8b949e">the one-per-section rule.</text>
  <g class="mono" font-size="15"><rect x="26" y="273" width="63" height="30" rx="15" fill="#10161d" stroke="#1f2a36"/>
<text x="58" y="294" text-anchor="middle" fill="#8b949e">React</text>
<rect x="97" y="273" width="108" height="30" rx="15" fill="#10161d" stroke="#1f2a36"/>
<text x="151" y="294" text-anchor="middle" fill="#8b949e">TypeScript</text>
<rect x="213" y="273" width="90" height="30" rx="15" fill="#10161d" stroke="#1f2a36"/>
<text x="258" y="294" text-anchor="middle" fill="#8b949e">Supabase</text></g>
  <g transform="translate(300,104) scale(0.86)">
  <circle class="hub" cx="90" cy="90" r="24" fill="#bc8cff" opacity=".25"/>
  <line class="link l1" x1="90" y1="90" x2="90" y2="28" stroke="#bc8cff" stroke-width="1.6"/><line class="link l2" x1="90" y1="90" x2="152" y2="90" stroke="#bc8cff" stroke-width="1.6"/><line class="link l3" x1="90" y1="90" x2="90" y2="152" stroke="#bc8cff" stroke-width="1.6"/><line class="link l4" x1="90" y1="90" x2="28" y2="90" stroke="#bc8cff" stroke-width="1.6"/>
  <circle cx="90" cy="90" r="16" fill="#10161d" stroke="#bc8cff" stroke-width="1.5"/>
  <text class="mono" x="90" y="94" font-size="9" text-anchor="middle" fill="#e6edf3">team</text>
  <circle cx="90" cy="28" r="12" fill="#10161d" stroke="#1f2a36"/><text class="mono" x="90" y="32" font-size="9" text-anchor="middle" fill="#e6edf3">A1</text><circle cx="152" cy="90" r="12" fill="#10161d" stroke="#1f2a36"/><text class="mono" x="152" y="94" font-size="9" text-anchor="middle" fill="#e6edf3">B2</text><circle cx="90" cy="152" r="12" fill="#10161d" stroke="#1f2a36"/><text class="mono" x="90" y="156" font-size="9" text-anchor="middle" fill="#e6edf3">C3</text><circle cx="28" cy="90" r="12" fill="#10161d" stroke="#1f2a36"/><text class="mono" x="28" y="94" font-size="9" text-anchor="middle" fill="#e6edf3">D1</text></g>
  <rect x=".5" y=".5" width="479" height="323" rx="16" fill="none" stroke="#1f2a36"/>
</g>
</svg>